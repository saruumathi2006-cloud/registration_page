<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="form-container">
    <div class="form-header">
      <h2>Create Account</h2>
      <p>Please fill in the details below to register.</p>
    </div>

    <form id="registrationForm" novalidate>
      <!-- Name Field -->
      <div class="form-group" id="group-name">
        <label for="name">Full Name</label>
        <div class="input-wrapper">
          <input 
            type="text" 
            id="name" 
            name="name" 
            placeholder="e.g. John Doe" 
            autocomplete="name"
          >
          <span class="status-icon" aria-hidden="true"></span>
        </div>
        <p class="error-message" id="nameError"></p>
      </div>

      <!-- Email Field -->
      <div class="form-group" id="group-email">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="e.g. user@example.com" 
            autocomplete="email"
          >
          <span class="status-icon" aria-hidden="true"></span>
        </div>
        <p class="error-message" id="emailError"></p>
      </div>

      <!-- Password Field -->
      <div class="form-group" id="group-password">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="At least 6 characters" 
            autocomplete="new-password"
          >
          <button type="button" id="togglePasswordBtn" class="toggle-password" aria-label="Toggle password visibility">
            👁️
          </button>
          <span class="status-icon" aria-hidden="true"></span>
        </div>
        <p class="error-message" id="passwordError"></p>
        <p class="input-hint">Must be at least 6 characters long.</p>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submitBtn" class="submit-btn" disabled>
        Register
      </button>

      <!-- Success Notification -->
      <div id="successMessage" class="success-message" role="alert" style="display: none;">
        Registration successful! Welcome aboard.
      </div>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
